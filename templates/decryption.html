{% extends "base.html" %}

{% block title %}StegoSecure | Decryption{% endblock %}

{% block content %}

<style>
.decrypt-section {
    max-width: 1100px;
    margin: 45px auto;
    padding: 20px;
    color: var(--text);
}

.decrypt-section > h2 {
    font-size: 28px;
    margin-bottom: 35px;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 0.5px;
}

.decrypt-grid {
    display: grid;
    grid-template-columns: minmax(0, 560px);
    justify-content: center;
    gap: 24px;
}

.decrypt-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    position: relative;
}

.decrypt-card h3 {
    color: var(--primary);
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.decrypt-upload {
    display: block;
    width: 100%;
    box-sizing: border-box;
    border: 2px dashed rgba(0, 229, 255, 0.4);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    background: rgba(0, 229, 255, 0.02);
    transition: all 0.3s ease;
}

.decrypt-upload input[type="file"] {
    display: none !important;
}

.decrypt-upload strong {
    display: block;
    margin-bottom: 12px;
    color: var(--primary);
    font-size: 16px;
    font-weight: 600;
}

.decrypt-upload .help-text {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
}

.decrypt-upload:hover {
    background: rgba(0, 229, 255, 0.05);
    border-color: var(--primary);
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
}

.decrypt-preview {
    display: none;
    max-width: 100%;
    max-height: 220px;
    object-fit: contain;
    margin: 20px auto;
    border-radius: 8px;
    border: 1px solid var(--border);
}

.decrypt-field {
    width: 100%;
    padding: 14px;
    background: var(--navy-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 8px 0 20px;
    box-sizing: border-box;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s;
}

.decrypt-field:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
}

label {
    color: var(--muted);
    font-size: 13px;
    display: block;
    margin-bottom: 6px;
}

.decrypt-button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
}

.decrypt-button:hover:not(:disabled) {
    box-shadow: 0 0 20px rgba(181, 0, 255, 0.5);
    transform: translateY(-2px);
}

.decrypt-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(1);
}

.decrypt-result {
    display: none;
    margin-top: 35px;
    border-color: rgba(181, 0, 255, 0.4);
    box-shadow: 0 0 30px rgba(181, 0, 255, 0.15);
}

.decrypt-result textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    padding: 16px;
    background: var(--navy-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-sizing: border-box;
    color: var(--text);
    font-family: monospace;
    font-size: 14px;
    line-height: 1.5;
}

.decrypt-result textarea:focus {
    outline: none;
    border-color: var(--primary);
}

.decrypt-actions {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

.decrypt-actions button {
    padding: 12px 28px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--navy-light);
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}

.decrypt-actions button:hover:not(:disabled) {
    background: var(--primary);
    color: var(--bg-main);
    box-shadow: var(--glow);
}

.decrypt-actions button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.decrypt-status {
    margin-top: 15px;
    text-align: center;
    color: var(--primary);
    font-size: 14px;
    font-weight: 500;
}

.decrypt-hidden {
    display: none !important;
}

#payloadInformation {
    color: var(--muted);
    margin-bottom: 25px;
    font-size: 14px;
    background: rgba(0, 229, 255, 0.05);
    padding: 10px;
    border-radius: 6px;
    border: 1px solid rgba(0, 229, 255, 0.1);
}

@media(max-width:700px) {
    .decrypt-grid {
        grid-template-columns: 1fr;
    }
    .decrypt-card {
        padding: 20px;
    }
}
</style>

<section class="decrypt-section">

    <h2 style="text-align:center;">
        Decrypt Your Hidden Data
    </h2>

    <form id="decryptForm"
          enctype="multipart/form-data">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <div class="decrypt-grid">

            <!-- UPLOAD IMAGE -->

            <div class="decrypt-card">

                <h3>1. Upload Encrypted Image</h3>

                <label class="decrypt-upload">

                    <strong>Select Encrypted PNG</strong>

                    <p class="help-text">
                        Upload the original PNG generated by StegoSecure.
                    </p>

                    <input type="file"
                           id="encryptedImage"
                           name="encrypted_image"
                           accept="image/png"
                           required>

                </label>

                <img id="decryptPreview"
                     class="decrypt-preview"
                     alt="Encrypted image preview">

                <p id="selectedImageName"
                   style="text-align:center; color: var(--muted); font-size: 13px; margin-top: 15px;"></p>
                <p id="decryptStatus"
                    class="decrypt-status"
                    aria-live="polite"></p>

            </div>



        </div>

        <!-- AUTHENTICATION -->

        <div id="authenticationSection"
             class="decrypt-card decrypt-hidden"
             style="margin-top:24px;">



            <h3>3. Authentication</h3>

            <p id="payloadInformation"
               style="text-align:center;"></p>

            <div id="questionSection"
                 class="decrypt-hidden">

                <label>Security question</label>

                <input type="text"
                       id="displayQuestion"
                       class="decrypt-field"
                       readonly>

            </div>

            <div id="credentialSection"
                 class="decrypt-hidden">

                <label id="credentialLabel">
                    Security answer
                </label>

                <input type="password"
                       id="credential"
                       class="decrypt-field"
                       autocomplete="off"
                       required>

            </div>

            <button type="button"
                    id="decryptButton"
                    class="decrypt-button"
                    disabled>

                Decrypt Image

            </button>

        </div>

    </form>

    <!-- RESULT -->

    <div id="decryptResult"
         class="decrypt-card decrypt-result">

        <h3>4. Decrypted Result</h3>

        <div id="textResult"
             class="decrypt-hidden">

            <textarea id="decryptedText"
                      readonly
                      placeholder="Decrypted text will appear here..."></textarea>

        </div>

        <div id="fileResult"
             class="decrypt-hidden">

            <p id="decryptedFilename"
               style="text-align:center; color: var(--primary); font-weight: 600; margin-bottom: 15px;"></p>

            <div class="decrypt-actions">

                <button type="button"
                        id="viewFileButton">
                    View
                </button>

                <button type="button"
                        id="downloadFileButton">
                    Download
                </button>

            </div>

            <p id="viewMessage"
               class="decrypt-status"></p>

        </div>

    </div>

</section>

{% endblock %}


{% block extra_js %}

<script>
(() => {

    const form = document.getElementById("decryptForm");
    const imageInput = document.getElementById("encryptedImage");

    const preview = document.getElementById("decryptPreview");
    const imageName = document.getElementById("selectedImageName");

    const authSection = document.getElementById("authenticationSection");
    const questionSection = document.getElementById("questionSection");
    const credentialSection = document.getElementById("credentialSection");

    const questionInput = document.getElementById("displayQuestion");
    const credentialInput = document.getElementById("credential");
    const credentialLabel = document.getElementById("credentialLabel");

    const decryptButton = document.getElementById("decryptButton");
    const status = document.getElementById("decryptStatus");

    const resultSection = document.getElementById("decryptResult");
    const textResult = document.getElementById("textResult");
    const fileResult = document.getElementById("fileResult");

    let selectedFile = null;
    let metadata = null;
    let resultBlob = null;
    let resultObjectUrl = null;
    let resultFilename = "decrypted_file";
    let previewObjectUrl = null;

    function clearResult() {
        resultSection.style.display = "none";
        textResult.classList.add("decrypt-hidden");
        fileResult.classList.add("decrypt-hidden");

        resultBlob = null;

        if (resultObjectUrl) {
            URL.revokeObjectURL(resultObjectUrl);
            resultObjectUrl = null;
        }
    }

    function getFormData() {
        const data = new FormData();

        data.append("encrypted_image", selectedFile);
        data.append(
            "csrf_token",
            form.querySelector('[name="csrf_token"]').value
        );

        return data;
    }

    imageInput.addEventListener("change", async () => {

        selectedFile = imageInput.files[0] || null;
        if (previewObjectUrl) {
            URL.revokeObjectURL(previewObjectUrl);
            previewObjectUrl = null;
        }

        preview.removeAttribute("src");
        preview.style.display = "none";
        metadata = null;

        authSection.classList.add("decrypt-hidden");
        credentialSection.classList.add("decrypt-hidden");
        questionSection.classList.add("decrypt-hidden");

        decryptButton.disabled = true;
        credentialInput.value = "";
        status.textContent = "";
        clearResult();

        if (!selectedFile) return;

        if (selectedFile.type !== "image/png") {
            status.textContent = "Please select a PNG image.";
            imageInput.value = "";
            selectedFile = null;
            return;
        }

        if (selectedFile.size > 40 * 1024 * 1024) {
            status.textContent = "Image exceeds the 40 MB upload limit.";
            imageInput.value = "";
            selectedFile = null;
            return;
        }

        previewObjectUrl = URL.createObjectURL(selectedFile);
        preview.src = previewObjectUrl;
        preview.style.display = "block";

        imageName.textContent = selectedFile.name;
        status.textContent = "Inspecting encrypted image...";

        try {

            const response = await fetch(
                "{{ url_for('decrypt_inspect') }}",
                {
                    method: "POST",
                    body: getFormData()
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Image inspection failed.");
            }

            metadata = data;

            authSection.classList.remove("decrypt-hidden");

            document.getElementById("payloadInformation").textContent =
                "Payload type: " + metadata.payload_type +
                " | Authentication: " + metadata.authentication_type;

            if (metadata.authentication_type === "QA") {

                questionSection.classList.remove("decrypt-hidden");
                questionInput.value = metadata.question;

                credentialLabel.textContent = "Your security answer";

            } else {

                questionSection.classList.add("decrypt-hidden");
                credentialLabel.textContent = "Your secret key";

            }

            credentialSection.classList.remove("decrypt-hidden");

            credentialInput.type =
                metadata.authentication_type === "KEY"
                    ? "text"
                    : "password";

            status.textContent = "Image inspected. Enter your credential.";
            decryptButton.disabled = false;

        } catch (error) {

            status.textContent = error.message;

        }

    });

    decryptButton.addEventListener("click", async () => {

        if (!selectedFile || !metadata) return;

        if (!credentialInput.value.trim()) {
            status.textContent = "Please enter your answer or key.";
            return;
        }

        decryptButton.disabled = true;
        status.textContent = "Decrypting...";

        clearResult();

        const data = getFormData();
        data.append("credential", credentialInput.value);

        try {

            const response = await fetch(
                "{{ url_for('decrypt') }}",
                {
                    method: "POST",
                    body: data
                }
            );

            if (!response.ok) {

                const errorData = await response.json();
                throw new Error(errorData.error || "Decryption failed.");

            }

            resultSection.style.display = "block";

            if (metadata.payload_type === "TEXT") {

                const result = await response.json();

                document.getElementById("decryptedText").value =
                    result.data;

                textResult.classList.remove("decrypt-hidden");

            } else {

                resultBlob = await response.blob();

                resultFilename =
                    response.headers.get("X-File-Name") ||
                    metadata.filename ||
                    "decrypted_file";

                const mimeType =
                    response.headers.get("X-File-Mime") ||
                    resultBlob.type ||
                    "application/octet-stream";

                resultBlob = new Blob([resultBlob], {
                    type: mimeType
                });

                resultObjectUrl = URL.createObjectURL(resultBlob);

                document.getElementById("decryptedFilename").textContent =
                    resultFilename;

                fileResult.classList.remove("decrypt-hidden");

                document.getElementById("viewMessage").textContent =
                    ["application/pdf", "text/plain",
                     "image/png", "image/jpeg", "image/gif",
                     "image/webp"].includes(mimeType)
                    ? "This file can be viewed in your browser."
                    : "Preview is not supported for this file type. You can download it.";

                document.getElementById("viewFileButton").disabled =
                    !["application/pdf", "text/plain",
                      "image/png", "image/jpeg", "image/gif",
                      "image/webp"].includes(mimeType);

            }

            status.textContent = "Decryption successful.";

        } catch (error) {

            status.textContent = error.message;

        } finally {

            decryptButton.disabled = false;

        }

    });

    document.getElementById("viewFileButton")
        .addEventListener("click", () => {

            if (resultObjectUrl) {
                window.open(resultObjectUrl, "_blank", "noopener");
            }

        });

    document.getElementById("downloadFileButton")
        .addEventListener("click", () => {

            if (!resultObjectUrl) return;

            const link = document.createElement("a");

            link.href = resultObjectUrl;
            link.download = resultFilename;

            document.body.appendChild(link);
            link.click();
            link.remove();

        });

    // Automatically load a saved gallery image when arriving from Previous Images.
    const galleryId = new URLSearchParams(window.location.search)
        .get("gallery_id");

    if (galleryId) {
        if (!/^\d+$/.test(galleryId)) {
            status.textContent = "Invalid saved image reference.";
        } else {
            status.textContent = "Loading your saved encrypted image...";

            fetch(`/previous/${galleryId}/file`, {
                method: "GET",
                credentials: "same-origin"
            })
            .then(async response => {
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(
                        data.error || "Unable to load the saved image."
                    );
                }

                const blob = await response.blob();
                const filename =
                    response.headers.get("X-File-Name") ||
                    "encrypted_image.png";

                const file = new File(
                    [blob],
                    filename,
                    { type: "image/png" }
                );

                const transfer = new DataTransfer();
                transfer.items.add(file);

                imageInput.files = transfer.files;

                imageInput.dispatchEvent(
                    new Event("change", { bubbles: true })
                );
            })
            .catch(error => {
                status.textContent = error.message;
            });
        }
    }

})();
</script>

{% endblock %}
