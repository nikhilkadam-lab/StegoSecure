<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | StegoSecure</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080b16;
            font-family: Inter, sans-serif;
            color: white;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #111a2e;
            border: 1px solid rgba(0,229,255,.25);
            border-radius: 15px;
            box-shadow: 0 0 35px rgba(0,229,255,.07);
        }

        .brand {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .brand span { color: #00e5ff; }

        h2 {
            text-align: center;
            font-size: 19px;
            margin-top: 25px;
        }

        .subtitle {
            text-align: center;
            color: #8998b0;
            font-size: 13px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 9px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #080f20;
            border: 1px solid #283650;
            border-radius: 7px;
            color: white;
            margin-bottom: 22px;
            outline: none;
        }

        input:focus { border-color: #00e5ff; }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: linear-gradient(90deg,#00cde8,#8c35ff);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { opacity: .9; }

        .flash {
            background: rgba(255,70,70,.12);
            border: 1px solid rgba(255,70,70,.3);
            color: #ff9292;
            padding: 12px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #00e5ff;
            font-size: 12px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">Stego<span>Secure</span></div>

    <h2>Administrator Login</h2>

    <p class="subtitle">Authorized access only</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="email">Admin Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter admin email"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Secure Login</button>

    </form>

    <a href="{{ url_for('home') }}" class="back">
        ← Back to Website
    </a>

</div>

</body>
</html>
