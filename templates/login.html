
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - StegoSecure</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            margin: 0; min-height: 100vh; padding: 100px 20px 30px;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; background: white;
            padding: 1rem 2rem; box-shadow: 0 2px 10px #0000001a;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: #4f46e5; text-decoration: none; }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .nav-link { color: #4b5563; text-decoration: none; padding: .6rem 1rem; border-radius: 8px; }
        .register-btn, .btn { background: #4f46e5; color: white; }
        .container { width: 100%; max-width: 400px; }
        .card { background: white; border-radius: 20px; padding: 2.5rem; box-shadow: 0 20px 60px #00000026; }
        .card-header { text-align: center; margin-bottom: 2rem; }
        .card-icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { color: #1f2937; font-size: 1.8rem; margin: 0 0 .5rem; }
        .subtitle { color: #6b7280; font-size: .95rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; color: #374151; font-size: .9rem; font-weight: 500; margin-bottom: .5rem; }
        input {
            width: 100%; padding: .9rem 1rem; border: 2px solid #e5e7eb;
            border-radius: 10px; font-size: 1rem; background: #f9fafb;
        }
        input:focus { outline: none; border-color: #4f46e5; background: white; }
        .btn { width: 100%; padding: 1rem; border: 0; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .message { padding: 1rem; border-radius: 10px; margin-top: 1.5rem; text-align: center; font-size: .9rem; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
        .register-link { text-align: center; margin-top: 1.5rem; color: #6b7280; font-size: .9rem; }
        .register-link a { color: #4f46e5; text-decoration: none; font-weight: 500; }
        @media (max-width: 480px) { .navbar { padding: 1rem; } .card { padding: 2rem 1.5rem; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('auth.login') }}" class="logo">🔐 StegoSecure</a>
        <div class="nav-links">
            <a href="{{ url_for('auth.login') }}" class="nav-link">Login</a>
            <a href="{{ url_for('auth.register') }}" class="nav-link register-btn">Register</a>
        </div>
    </nav>

    <main class="container">
        <section class="card">
            <header class="card-header">
                <div class="card-icon">🔑</div>
                <h1>Welcome Back</h1>
                <p class="subtitle">Sign in to your secure steganography account</p>
            </header>

            <form method="post" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" maxlength="254"
                           autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn">Sign In</button>
            </form>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <div class="register-link">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">Create one here</a>
            </div>
        </section>
    </main>
</body>
</html>
