<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - StegoSecure</title>
    
    <!-- Font import to match banner -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #050510;
            --bg-card: rgba(20, 25, 45, 0.6);
            --navy: #0a0b1a;
            --navy-light: #12142b;
            --primary: #00E5FF; /* Neon Cyan */
            --secondary: #B500FF; /* Neon Purple */
            --text: #FFFFFF;
            --muted: #A0A0C0;
            --border: rgba(0, 229, 255, 0.2);
            --glow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; }
        
        body {
            margin: 0; min-height: 100vh; padding: 100px 20px 30px;
            display: flex; justify-content: center; align-items: center;
            background: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(181, 0, 255, 0.08) 0%, transparent 50%);
            color: var(--text);
        }

        .navbar {
            position: fixed; top: 0; left: 0; right: 0; background: rgba(10, 11, 26, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }

        .logo { 
            font-size: 1.5rem; font-weight: 700; 
            text-decoration: none; 
            color: var(--text); 
            display: flex; align-items: center; gap: 8px;
        }
        
        .logo span {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; gap: 1rem; align-items: center; }
        
        .nav-link { 
            color: var(--text); text-decoration: none; padding: .6rem 1rem; border-radius: 8px; font-size: 14px; font-weight: 500;
            transition: all 0.2s;
        }
        
        .nav-link:hover {
            color: var(--primary);
            text-shadow: var(--glow);
        }

        .register-btn { 
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white; 
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
        
        .register-btn:hover {
            box-shadow: 0 0 20px rgba(181, 0, 255, 0.6);
            transform: translateY(-1px);
            color: white;
        }

        .container { width: 100%; max-width: 420px; }
        
        .card { 
            background: var(--bg-card); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px; padding: 2.5rem; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 20px rgba(0, 229, 255, 0.05); 
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .card-header { text-align: center; margin-bottom: 2rem; }
        
        .card-icon { font-size: 3rem; margin-bottom: 1rem; text-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        
        h1 { 
            font-size: 1.8rem; margin: 0 0 .5rem; 
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        
        .subtitle { color: var(--muted); font-size: .95rem; }

        .form-group { margin-bottom: 1.5rem; }
        
        label { display: block; color: var(--muted); font-size: .9rem; font-weight: 500; margin-bottom: .5rem; }
        
        input {
            width: 100%; padding: .9rem 1rem; border: 1px solid var(--border);
            border-radius: 10px; font-size: 1rem; background: var(--navy-light);
            color: var(--text); transition: all 0.2s;
        }
        
        input:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.2); 
        }

        .btn { 
            width: 100%; padding: 1rem; border: 0; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; 
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            transition: all 0.3s ease;
        }

        .btn:hover {
            box-shadow: 0 0 20px rgba(181, 0, 255, 0.5);
            transform: translateY(-2px);
        }

        .message { padding: 1rem; border-radius: 10px; margin-top: 1.5rem; text-align: center; font-size: .9rem; font-weight: 500; }
        
        .success { background: rgba(0, 255, 136, 0.1); color: #00FF88; border: 1px solid rgba(0, 255, 136, 0.3); }
        
        .error { background: rgba(255, 75, 75, 0.1); color: #FF4B4B; border: 1px solid rgba(255, 75, 75, 0.3); }

        .register-link { text-align: center; margin-top: 1.5rem; color: var(--muted); font-size: .9rem; }
        
        .register-link a { 
            color: var(--primary); text-decoration: none; font-weight: 500; 
            transition: all 0.2s;
        }
        
        .register-link a:hover { text-shadow: var(--glow); }

        @media (max-width: 480px) { 
            .navbar { padding: 1rem; } 
            .card { padding: 2rem 1.5rem; } 
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('auth.login') }}" class="logo">
            <span>🔐 StegoSecure</span>
        </a>
        <div class="nav-links">
            <a href="{{ url_for('auth.login') }}" class="nav-link">Login</a>
            <a href="{{ url_for('auth.register') }}" class="nav-link register-btn">Register</a>
        </div>
    </nav>

    <main class="container">
        <section class="card">
            <header class="card-header">
                <div class="card-icon">🔑</div>
                <h1>Welcome Back</h1>
                <p class="subtitle">Sign in to your secure steganography account</p>
            </header>

            <form method="post" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="next" value="{{ next_url }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" maxlength="254"
                           autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn">Sign In</button>
            </form>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <div class="register-link">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">Create one here</a>
            </div>
        </section>
    </main>
</body>
</html>
