<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StegoSecure Dashboard</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 30px #00000012;
            text-align: center;
        }
        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 7px;
            background: #263b80;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Welcome to StegoSecure</h1>
        <p>You are logged in as {{ session["username"] }}.</p>
        <form action="{{ url_for('auth.logout') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Log out</button>
        </form>
    </main>
</body>
</html>
